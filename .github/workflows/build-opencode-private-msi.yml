name: build-opencode-private-msi

on:
  push:
    branches:
      - enterprise-policy
    paths:
      - ".github/workflows/build-opencode-private-msi.yml"
      - "packages/opencode/**"
      - "packages/core/**"
      - "packages/tui/**"
      - "packages/server/**"
      - "packages/llm/**"
      - "packages/plugin/**"
      - "packages/ui/**"
      - "packages/app/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --linker hoisted
        timeout-minutes: 20

      - name: Install Windows native build helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nodeGypRoot = Join-Path $env:RUNNER_TEMP "node-gyp"
          New-Item -ItemType Directory -Force -Path $nodeGypRoot | Out-Null
          npm install --prefix $nodeGypRoot --ignore-scripts --package-lock=false node-gyp
          $nodeGyp = Join-Path $nodeGypRoot "node_modules\node-gyp\bin\node-gyp.js"
          if (!(Test-Path $nodeGyp)) {
            throw "node-gyp not found: $nodeGyp"
          }
          "npm_config_node_gyp=$nodeGyp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        timeout-minutes: 5

      - name: Build Windows CLI
        run: bun run build --single --baseline --skip-install
        working-directory: packages/opencode
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_BINARY_NPM_PREFIX: opencode

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "packages\opencode\dist"
          $cli = Join-Path $dist "opencode-windows-x64-baseline\bin\opencode.exe"
          if (!(Test-Path $cli)) {
            throw "Windows x64 CLI binary not found: $cli"
          }

          $msiDir = Join-Path $dist "msi"
          New-Item -ItemType Directory -Force -Path $msiDir | Out-Null

          $shim = Join-Path $msiDir "opencode.cmd"
          @'
          @echo off
          setlocal
          set "OPENCODE_CONFIG=%USERPROFILE%\.config\opencode.json"
          if not exist "%USERPROFILE%\.config" mkdir "%USERPROFILE%\.config" >nul 2>nul
          if not exist "%OPENCODE_CONFIG%" (
            >"%OPENCODE_CONFIG%" echo {
            >>"%OPENCODE_CONFIG%" echo   "$schema": "https://opencode.ai/config.json"
            >>"%OPENCODE_CONFIG%" echo }
          )
          "%~dp0opencode-private.exe" %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content -Path $shim -NoNewline -Encoding ascii

          $wxs = Join-Path $msiDir "opencode-private.wxs"
          @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package
              Name="OpenCode Private"
              Manufacturer="GreenHatx"
              Version="1.17.9"
              UpgradeCode="{1F8C375D-6316-4A20-967C-3FA2B098EAA1}"
              Scope="perUser">
              <MajorUpgrade DowngradeErrorMessage="A newer version of OpenCode Private is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <Feature Id="MainFeature" Title="OpenCode Private" Level="1">
                <ComponentGroupRef Id="OpenCodePrivateComponents" />
              </Feature>

              <StandardDirectory Id="LocalAppDataFolder">
                <Directory Id="InstallFolder" Name="OpenCode Private">
                  <Directory Id="BinFolder" Name="bin" />
                </Directory>
              </StandardDirectory>

            <ComponentGroup Id="OpenCodePrivateComponents">
              <Component Id="OpenCodeExeComponent" Directory="BinFolder" Guid="{91AE42C0-7B86-4C55-9EA8-C32E12F70E50}">
                <File Id="OpenCodeExe" Source="$cli" Name="opencode-private.exe" KeyPath="yes" />
              </Component>

              <Component Id="OpenCodeShimComponent" Directory="BinFolder" Guid="{5E78A046-51A7-4F52-B904-3CA5FDB71B27}">
                <File Id="OpenCodeShim" Source="$shim" Name="opencode.cmd" KeyPath="yes" />
              </Component>

              <Component Id="OpenCodeUserPathComponent" Directory="BinFolder" Guid="{BC789E4E-C7D1-4F1A-B204-6D13EE684475}">
                <RegistryValue Root="HKCU" Key="Software\GreenHatx\OpenCodePrivate" Name="PathEntry" Value="1" Type="integer" KeyPath="yes" />
                <Environment Id="OpenCodeUserPath" Name="PATH" Value="[BinFolder]" Permanent="no" Part="last" Action="set" System="no" />
              </Component>
            </ComponentGroup>
          </Package>
          </Wix>
          "@ | Set-Content -Path $wxs -Encoding utf8

          wix build $wxs -arch x64 -out (Join-Path $dist "opencode-private-windows-x64.msi")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-private-windows-x64-msi
          path: packages/opencode/dist/opencode-private-windows-x64.msi
