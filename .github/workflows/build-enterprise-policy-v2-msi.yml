name: build-enterprise-policy-v2-msi

on:
  workflow_dispatch:
  push:
    branches:
      - enterprise-v2-msi
    paths:
      - ".github/workflows/build-enterprise-policy-v2-msi.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --linker hoisted
        timeout-minutes: 20

      - name: Prepare desktop
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: 2.1.2
          OPENCODE_WINDOWS_SIGNING: "false"
          OPENCODE_CLI_TARGET: x86_64-pc-windows-msvc
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Build desktop
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: 2.1.2
          OPENCODE_WINDOWS_SIGNING: "false"
          OPENCODE_CLI_TARGET: x86_64-pc-windows-msvc

      - name: Package MSI
        run: npx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: 2.1.2
          OPENCODE_WINDOWS_SIGNING: "false"
          OPENCODE_WINDOWS_TARGETS: msi
          OPENCODE_CLI_TARGET: x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-enterprise-policy-v2-windows-x64-msi
          path: packages/desktop/dist/*.msi
